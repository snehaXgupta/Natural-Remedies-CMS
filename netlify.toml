[build]
  base = "client"
  publish = "dist"
  command = "npm run build"

# Proxy API requests to Render backend
[[redirects]]
  from = "/api/*"
  to = "https://natural-remedies-cms.onrender.com/api/:splat"
  status = 200
  force = true

# SPA client-side routing fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
